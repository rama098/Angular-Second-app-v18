<div class="row">
    <div class="col-4">
        <ul>
            <li *ngFor="let item of roleList">{{item.RoleName}}</li>
        </ul>
    </div>

    <div class="col-4">
        <select class="form-select">
            <option value="">--select option --</option>
            <option *ngFor="let item of roleList">{{item.RoleName}}</option>
        </select>
    </div>
</div>

<div class="row">
    <div class="col-6">
        <table class="table table-boarded  table-striped">
            <thead>
                <tr>
                    <th>slno</th>
                    <th>roles</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of roleList;let i= index">
                    <td>
                        {{i+1}}
                    </td>
                    <td>{{item.RoleName}}</td>
                </tr>
            </tbody>

        </table>
    </div>
</div>
