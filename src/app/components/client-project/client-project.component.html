<div class="container-fluid">
    <div class="card">
        <div class="card-header">
            <h4 class="card-title">Client Project Details</h4>
        </div>
        <div class="card-body">

            <div class="row">
                <div class="col-8">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="card-title bg-success text-white">Client-Project List</h4>
                        </div>
                        <div class="card-body">
                            <table class="table table-boadered">
                                <thead>
                                    <tr>
                                        <th>Slno</th>
                                        <th>Company Name</th>
                                        <th>Person Name</th>
                                        <th>Contact No</th>
                                        <th>City</th>
                                        <th>Action</th>
                                    </tr>

                                </thead>
                                <tbody>
                                    <tr>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>

                </div>
                <div class="col-4">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="card-title bg-success text-white">New Client-Project</h4>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-6">
                                    <label class="form-label">Project Name</label>
                                    <input class="form-control" />
                                </div>
                                <div class="col-6">
                                    <label>Start Date</label>
                                    <input class="form-control" type="date" />
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6">
                                    <label for="">Contact No</label>
                                    <input class="form-control" />
                                </div>
                                <div class="col-6">
                                    <label>Contact Email</label>
                                    <input class="form-control" />
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-12">
                                    <label>Project Description</label>
                                    <textarea class="form-control"></textarea>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6">
                                    <label>Project Costing</label>
                                    <select class="form-select">
                                        <option value="0">--select Client--</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label>Lead By</label>
                                    <select class="form-select">
                                        <option value="0">--select Employee--</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="text-end">
                                    <button class="btn btn-success" type="button">Save Project</button>
                                </div>
                                <div class="text-start">
                                    <button class="btn btn-secondary">Reset</button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
